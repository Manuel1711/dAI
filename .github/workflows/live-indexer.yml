name: Live Indexer Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps for analytics build
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib

      - name: Ensure data dirs
        run: mkdir -p data/live data/analytics

      - name: Run one-shot indexer
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          IDENTITY_REGISTRY: ${{ vars.IDENTITY_REGISTRY }}
          FEEDBACK_REGISTRY: ${{ vars.FEEDBACK_REGISTRY }}
          CONFIRMATIONS: ${{ vars.CONFIRMATIONS }}
          BLOCK_CHUNK: ${{ vars.BLOCK_CHUNK }}
          MAX_CHUNKS_PER_TICK: ${{ vars.MAX_CHUNKS_PER_TICK }}
          START_BLOCK: ${{ vars.START_BLOCK }}
        run: |
          if [ -z "$ETH_RPC_URL" ]; then
            echo "ETH_RPC_URL secret missing, using public fallback endpoint";
            export ETH_RPC_URL="https://ethereum-rpc.publicnode.com"
          fi
          : "${CONFIRMATIONS:=12}"
          : "${BLOCK_CHUNK:=1000}"
          : "${MAX_CHUNKS_PER_TICK:=50}"
          : "${START_BLOCK:=0}"
          node scripts/indexer-loop.mjs --once

      - name: Build analytics datasets
        run: python3 scripts/build-analytics-data.py

      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agents.snapshot.json data/live/*.json data/live/*.jsonl data/analytics/*.json || true
          if git diff --staged --quiet; then
            echo "No dataset changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh live index + analytics snapshot"

          # Robust push: handle non-fast-forward when main moved during run
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after retries"
          exit 1
